info:
  name: Get all todos (1)
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/todo?orderBy=desc&limit=2"
  params:
    - name: orderBy
      value: desc
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

runtime:
  variables:
    - name: BASE_URL
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
